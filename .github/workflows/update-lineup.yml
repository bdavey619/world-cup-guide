name: Update Confirmed XIs

# Runs every 30 minutes during the tournament window (Jun 11 – Jul 19 2026).
# The script checks ESPN for lineups released ~1hr before kickoff and only
# writes + pushes when it finds new starters — silent no-op otherwise.
on:
  schedule:
    # Runs every 30 minutes, all day, throughout June and July.
    # Games run 9 AM–9 PM PT (16:00–04:00 UTC); extra time / penalties can push
    # finishes to ~06:00 UTC. Running around the clock eliminates any gap where
    # scores, standings, or XIs could go stale overnight.
    - cron: '0,30 * * 6,7 *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch lineups for (YYYY-MM-DD). Leave blank for auto.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch confirmed XIs from ESPN
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/update-lineup.js --date "${{ inputs.date }}"
          else
            node scripts/update-lineup.js
          fi

      - name: Commit and push if changed
        id: diff
        run: |
          git diff --quiet src/data/teams/ && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/teams/
          git commit -m "Auto: confirmed XIs for $(date -u '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed"
            [ "$i" = "3" ] && exit 1
            sleep 5
          done
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Trigger redeploy
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: lineup-updated
