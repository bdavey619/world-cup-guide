name: Update Confirmed XIs

# Runs every 30 minutes during the tournament window (Jun 11 – Jul 19 2026).
# The script checks ESPN for lineups released ~1hr before kickoff and only
# writes + pushes when it finds new starters — silent no-op otherwise.
on:
  schedule:
    # Runs every 30 minutes during match announcement windows.
    # Kickoff windows (UTC): 17:00–01:00 (afternoon/evening ET) and 00:00–04:30
    # (midnight ET). Lineups drop ~1hr before kickoff; 30-min frequency survives
    # a skipped GitHub Actions cron run without missing the window.
    - cron: '0,30 0-4,17-23 * 6,7 *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch lineups for (YYYY-MM-DD). Leave blank for auto.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch confirmed XIs from ESPN
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/update-lineup.js --date "${{ inputs.date }}"
          else
            node scripts/update-lineup.js
          fi

      - name: Commit and push if changed
        id: diff
        run: |
          git diff --quiet src/data/teams/ && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/teams/
          git commit -m "Auto: confirmed XIs for $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Trigger redeploy
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: lineup-updated
