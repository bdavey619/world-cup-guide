name: Update World Cup Data

on:
  schedule:
    # Dead-man's switch — restarts the self-chain if it ever breaks.
    - cron: '*/5 * * 6,7 *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch lineups for (YYYY-MM-DD). Leave blank for auto.'
        required: false
        default: ''

# Prevent duplicate concurrent runs (schedule firing while self-chain is mid-run).
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch confirmed XIs from ESPN
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/update-lineup.js --date "${{ inputs.date }}"
          else
            node scripts/update-lineup.js
          fi

      - name: Fetch and update standings
        run: node scripts/update-standings.js

      - name: Fetch and update stats
        run: node scripts/update-stats.js

      - name: Fetch and update bracket results
        run: node scripts/update-bracket.js

      - name: Commit and push if changed
        id: commit
        run: |
          git diff --quiet src/data/ && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git commit -m "chore: update data $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed"
            [ "$i" = "3" ] && exit 1
            sleep 5
          done
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Trigger redeploy
        if: steps.commit.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: standings-updated

      - name: Wait then self-chain next run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const month = new Date().getUTCMonth() + 1
            if (month < 6 || month > 7) {
              console.log('Outside tournament window (Jun–Jul) — not re-chaining.')
              return
            }
            // Space runs ~5 minutes apart without burning a separate runner slot for sleep.
            await new Promise(r => setTimeout(r, 4 * 60 * 1000))
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'update-data.yml',
                ref: 'main',
              })
              console.log('Next run dispatched.')
            } catch (e) {
              console.warn('Self-dispatch failed — schedule will recover:', e.message)
            }
