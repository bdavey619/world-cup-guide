name: Update World Cup Data

# Single scheduled workflow replacing the three separate update-lineup,
# update-standings, and update-stats workflows. One runner slot per cycle
# instead of three competing for the queue — eliminates GitHub Actions
# throttling gaps during live matches.
on:
  schedule:
    # Every 5 minutes, all day, June–July.
    - cron: '*/5 * * 6,7 *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch lineups for (YYYY-MM-DD). Leave blank for auto.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch confirmed XIs from ESPN
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/update-lineup.js --date "${{ inputs.date }}"
          else
            node scripts/update-lineup.js
          fi

      - name: Fetch and update standings
        run: node scripts/update-standings.js

      - name: Fetch and update stats
        run: node scripts/update-stats.js

      - name: Commit and push if changed
        id: commit
        run: |
          git diff --quiet src/data/ && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git commit -m "chore: update data $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed"
            [ "$i" = "3" ] && exit 1
            sleep 5
          done
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Trigger redeploy
        if: steps.commit.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: standings-updated
