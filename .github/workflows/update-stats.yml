name: Update Stats

# Runs 3× daily during the tournament, matching the standings schedule.
on:
  schedule:
    - cron: '15 13 * * *'   # 9:15 AM ET
    - cron: '15 19 * * *'   # 3:15 PM ET
    - cron: '15  2 * * *'   # 10:15 PM ET (next UTC day)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and update stats
        run: node scripts/update-stats.js

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet src/data/stats.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated stats
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json
          git commit -m "chore: update stats $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Trigger redeploy
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: stats-updated
