name: Update Standings

# Runs every 30 minutes during the tournament window (Jun–Jul), offset by 5
# minutes from the lineup update to avoid simultaneous pushes to main.
on:
  schedule:
    - cron: '5,35 0-5,13-23 * 6,7 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and update standings
        run: node scripts/update-standings.js

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet src/data/teams/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated standings
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/teams/
          git commit -m "chore: update standings $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed"
            [ "$i" = "3" ] && exit 1
            sleep 5
          done

      - name: Trigger redeploy
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: standings-updated
