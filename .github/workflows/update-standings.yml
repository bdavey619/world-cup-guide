name: Update Standings

# Runs 3× daily during the group stage (Jun 11 – Jul 2)
# and once daily during knockout stage (Jul 3 – Jul 23).
# Also runnable manually via the Actions tab.
on:
  schedule:
    # 9 AM, 3 PM, and 10 PM ET (UTC -4 in summer)
    - cron: '0 13 * * *'   # 9 AM ET
    - cron: '0 19 * * *'   # 3 PM ET
    - cron: '0  2 * * *'   # 10 PM ET (next UTC day)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and update standings
        run: node scripts/update-standings.js

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet src/data/teams/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated standings
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/teams/
          git commit -m "chore: update standings $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

      - name: Trigger redeploy
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: standings-updated
